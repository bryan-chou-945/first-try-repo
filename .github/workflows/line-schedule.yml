name: Scheduled LINE message

on:
  schedule:
    # GitHub cron 使用 UTC。台灣時間 = UTC+8
    # 下面是「每天台灣時間 08:00」= UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:        # 允許在 Actions 頁面手動觸發測試
    inputs:
      message:
        description: "要發送的訊息（留空則使用 messages.txt）"
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send LINE message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          LINE_MESSAGE: ${{ github.event.inputs.message }}
        run: python line-scheduler/send_line.py
